<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="color-scheme" content="dark" />
<title>拓星小队 · 灰盒试玩</title>
<style>
:root {
  --bg0: #1a1410;
  --bg1: #2a2118;
  --sand: #c4a574;
  --rust: #b85c38;
  --ox: #3d8b7a;
  --ink: #f3ebe0;
  --muted: #b8a894;
  --panel: rgba(28, 22, 16, 0.82);
  --line: rgba(243, 235, 224, 0.14);
  --glow: rgba(184, 92, 56, 0.45);
  --ok: #d9a441;
  --danger: #c45c4a;
  --radius: 10px;
  /* 离线单文件：不拉 CDN，优先本机中文黑体/楷体 */
  font-family: 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans SC', sans-serif;
  color: var(--ink);
  background: var(--bg0);
}

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  min-height: 100%;
  background:
    radial-gradient(120% 80% at 50% -10%, #5a3a22 0%, transparent 55%),
    linear-gradient(180deg, #2b1d14 0%, #14100c 48%, #0e1614 100%);
}

body {
  display: flex;
  justify-content: center;
}

#app {
  width: min(100vw, 430px);
  min-height: 100dvh;
  padding: 12px 12px 28px;
}

.shell {
  display: flex;
  flex-direction: column;
  gap: 10px;
  min-height: calc(100dvh - 40px);
}

.brand {
  font-family: 'STKaiti', 'KaiTi', 'FangSong', 'PingFang SC', serif;
  font-size: 1.55rem;
  letter-spacing: 0.08em;
  color: var(--sand);
  text-shadow: 0 2px 0 rgba(0, 0, 0, 0.35);
}

.sub {
  color: var(--muted);
  font-size: 0.85rem;
  line-height: 1.4;
  margin-top: 2px;
}

.panel {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 10px 12px;
  backdrop-filter: blur(6px);
}

.opp-row,
.me-row {
  display: flex;
  justify-content: space-between;
  gap: 8px;
  align-items: center;
}

.name {
  font-weight: 700;
}

.muted {
  color: var(--muted);
  font-size: 0.8rem;
}

.tracks {
  display: grid;
  gap: 6px;
  margin-top: 8px;
}

.track {
  display: grid;
  grid-template-columns: 42px 1fr 36px;
  align-items: center;
  gap: 8px;
  font-size: 0.82rem;
}

.cells {
  display: flex;
  gap: 4px;
}

.cell {
  width: 18px;
  height: 12px;
  border-radius: 3px;
  background: rgba(255, 255, 255, 0.08);
  border: 1px solid rgba(255, 255, 255, 0.08);
}

.cell.on.temp {
  background: var(--rust);
  box-shadow: 0 0 8px var(--glow);
}

.cell.on.oxygen {
  background: var(--ox);
  box-shadow: 0 0 8px rgba(61, 139, 122, 0.45);
}

.market {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 8px;
}

.card {
  position: relative;
  text-align: left;
  padding: 10px;
  min-height: 118px;
  border-radius: 12px;
  border: 1px solid var(--line);
  background: linear-gradient(160deg, #3a2a1d, #221910 70%);
  color: var(--ink);
  cursor: pointer;
  transition: transform 0.18s ease, border-color 0.18s ease, box-shadow 0.18s ease;
}

.card:hover:not(:disabled) {
  transform: translateY(-2px);
}

.card.affordable {
  border-color: rgba(217, 164, 65, 0.7);
  box-shadow: 0 0 0 1px rgba(217, 164, 65, 0.25);
}

.card.soon {
  outline: 1px dashed rgba(196, 165, 116, 0.55);
}

.card:disabled {
  opacity: 0.55;
  cursor: default;
}

.card .tag {
  font-size: 0.68rem;
  color: var(--sand);
  margin-bottom: 4px;
}

.card .title {
  font-weight: 700;
  font-size: 0.95rem;
  margin-bottom: 4px;
}

.card .meta {
  font-size: 0.75rem;
  color: var(--muted);
  line-height: 1.35;
}

.badge {
  position: absolute;
  top: 8px;
  right: 8px;
  font-size: 0.65rem;
  color: #2a1a10;
  background: var(--sand);
  padding: 1px 5px;
  border-radius: 999px;
}

.colony {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 6px;
}

.slot {
  min-height: 54px;
  border-radius: 8px;
  border: 1px dashed rgba(255, 255, 255, 0.12);
  background: rgba(0, 0, 0, 0.18);
  padding: 6px;
  font-size: 0.7rem;
  line-height: 1.25;
}

.slot.filled {
  border-style: solid;
  border-color: rgba(196, 165, 116, 0.35);
  background: linear-gradient(180deg, rgba(90, 58, 34, 0.55), rgba(20, 16, 12, 0.55));
}

.slot button.pause {
  margin-top: 4px;
  font-size: 0.65rem;
  padding: 2px 6px;
}

.resbar {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  align-items: center;
  justify-content: space-between;
}

.res {
  display: flex;
  gap: 10px;
  font-weight: 600;
}

.actions {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
  margin-top: 8px;
}

button.primary,
button.ghost,
button.respick {
  border: 0;
  border-radius: 10px;
  padding: 12px 10px;
  font: inherit;
  cursor: pointer;
}

button.primary {
  background: linear-gradient(180deg, #d9a441, #b85c38);
  color: #1a120c;
  font-weight: 700;
}

button.primary:disabled {
  opacity: 0.45;
  cursor: default;
}

button.ghost {
  background: rgba(255, 255, 255, 0.06);
  color: var(--ink);
  border: 1px solid var(--line);
}

button.respick {
  background: rgba(255, 255, 255, 0.08);
  color: var(--ink);
  border: 1px solid var(--line);
}

button.respick.on {
  border-color: var(--ok);
  box-shadow: 0 0 0 1px rgba(217, 164, 65, 0.35);
}

.log {
  max-height: 120px;
  overflow: auto;
  font-size: 0.75rem;
  color: var(--muted);
  line-height: 1.45;
}

.modal-backdrop {
  position: fixed;
  inset: 0;
  background: rgba(8, 6, 4, 0.72);
  display: flex;
  align-items: flex-end;
  justify-content: center;
  padding: 16px;
  z-index: 20;
}

.modal {
  width: min(100%, 420px);
  background: #221910;
  border: 1px solid var(--line);
  border-radius: 16px;
  padding: 16px;
  animation: rise 0.22s ease;
}

@keyframes rise {
  from {
    transform: translateY(16px);
    opacity: 0;
  }
  to {
    transform: translateY(0);
    opacity: 1;
  }
}

.modal h2 {
  margin: 0 0 8px;
  font-family: 'STKaiti', 'KaiTi', 'FangSong', 'PingFang SC', serif;
  color: var(--sand);
  font-weight: 400;
}

.modal p,
.modal li {
  color: var(--muted);
  font-size: 0.88rem;
  line-height: 1.45;
}

.modal ul {
  padding-left: 1.1em;
  margin: 8px 0;
}

.row {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}

.start-screen {
  display: flex;
  flex-direction: column;
  gap: 14px;
  justify-content: center;
  min-height: calc(100dvh - 40px);
  animation: fadein 0.45s ease;
}

@keyframes fadein {
  from {
    opacity: 0;
  }
  to {
    opacity: 1;
  }
}

select,
input[type='number'] {
  width: 100%;
  margin-top: 4px;
  padding: 10px;
  border-radius: 8px;
  border: 1px solid var(--line);
  background: rgba(0, 0, 0, 0.25);
  color: var(--ink);
  font: inherit;
}

.hint {
  font-size: 0.78rem;
  color: var(--ok);
}

.thinking {
  animation: pulse 1s ease-in-out infinite;
}

@keyframes pulse {
  0%,
  100% {
    opacity: 0.55;
  }
  50% {
    opacity: 1;
  }
}

.end-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
}

.end-box {
  background: rgba(0, 0, 0, 0.22);
  border-radius: 10px;
  padding: 10px;
  border: 1px solid var(--line);
}

.end-box strong {
  display: block;
  margin-bottom: 6px;
}

</style>
</head>
